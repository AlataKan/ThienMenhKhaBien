name: Auto Setup Cocos Creator & Web Preview

on:
  push:
    paths:
      - '.github/workflows/setup_cocos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tự động tạo cây thư mục Cocos Creator, Dữ liệu Hoài Dương & Bản chơi Web
        run: |
          cat << 'EOF' > generate_project.js
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          function writeFile(filePath, content, createCocosMeta = false) {
            const dir = path.dirname(filePath);
            fs.mkdirSync(dir, { recursive: true });
            const data = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
            fs.writeFileSync(filePath, data, 'utf8');
            if (createCocosMeta) {
              const uuid = crypto.randomUUID();
              fs.writeFileSync(filePath + '.meta', JSON.stringify({ ver: "1.0.0", uuid, importer: "auto" }, null, 2), 'utf8');
            }
          }

          // 1. Cấu hình dự án Cocos Creator 3.8.x
          writeFile('package.json', {
            name: "thien-menh-kha-bien",
            version: "0.1.0",
            description: "Fate Unfixed - Cocos Creator 3.8 TypeScript Project",
            creator: { name: "CocosCreator", version: "3.8.2" },
            scripts: { test: "node tests/run_reality_tests.js" }
          });

          writeFile('tsconfig.json', {
            compilerOptions: {
              target: "ES2020",
              module: "ES2020",
              strict: true,
              moduleResolution: "node",
              experimentalDecorators: true
            }
          });

          // 2. Dữ liệu cấu hình công thức (Mục 36.1, 7.3, 47.3)
          const gameConfig = {
            time: { tick_minutes: 1, micro_step_minutes: 6 },
            f_tuoi: {
              van_dong:   { tuoi_dinh: 22, q: 1.0, tuoi_suy: 35, tuoi_nua: 75, p: 2, san_gia: 0.15 },
              suc_manh:   { tuoi_dinh: 27, q: 1.0, tuoi_suy: 35, tuoi_nua: 70, p: 2, san_gia: 0.20 },
              chiu_dung:  { tuoi_dinh: 25, q: 1.0, tuoi_suy: 33, tuoi_nua: 65, p: 2, san_gia: 0.15 },
              tay_kheo:   { tuoi_dinh: 26, q: 0.8, tuoi_suy: 45, tuoi_nua: 80, p: 2, san_gia: 0.30 },
              thi_giac:   { tuoi_dinh: 20, q: 0.7, tuoi_suy: 40, tuoi_nua: 75, p: 2, san_gia: 0.30 },
              thinh_giac: { tuoi_dinh: 20, q: 0.7, tuoi_suy: 45, tuoi_nua: 80, p: 2, san_gia: 0.30 },
              noi:        { tuoi_dinh: 8,  q: 0.5, tuoi_suy: 70, tuoi_nua: 95, p: 2, san_gia: 0.50 },
              tri_nho:    { tuoi_dinh: 25, q: 0.8, tuoi_suy: 50, tuoi_nua: 85, p: 2, san_gia: 0.30 }
            },
            stopping_rule: {
              base_threshold: 55,
              weight_luoi: -0.45,
              weight_kien_nhan: 0.50,
              weight_y_chi: 0.35,
              weight_trach_nhiem: 0.25,
              push_through_boost: 25
            },
            reincarnation: {
              he_so_luan_chuyen: 2.0,
              he_so_hiem: {
                nong_no_ruong_dat: 1.0, nong_dan_tu_do: 1.0, ke_ngoai_le: 1.0,
                tho_thu_cong: 0.8, thuong_nhan_thi_dan: 0.6, giao_si: 0.5,
                ky_si_quan_nhan: 0.4, lanh_chua_vung: 0.2, thien_menh_chi_tu: 0.1
              }
            }
          };
          writeFile('assets/resources/data/config/game_config.json', gameConfig, true);

          // 3. Từ điển thể chế Hoài Dương & Kho mẫu hành động Schema v2 (Mục 34.9, 50.3)
          const worldAndActions = {
            the_che: {
              nguoi_cai_tri_toi_cao: { nam: "Vương", nu: "Nữ Vương" },
              lanh_chua_vung: "Chủ Ấp",
              quan_lai: { chung: "Chức Sự", huyen: "Tri Ấp" },
              ky_si_quan_nhan: "Kiếm Điền",
              giao_hoi: { to_chuc: "Hỏa Đường", linh_muc_lang: "Cha Đường", tham_van: "Soi Lửa" },
              phuong_hoi_nghe: "Hội Phường",
              thuong_doan: { tich_hai: "Đoàn Thuyền", hoai_duong: "Bang Hàng" },
              nong_no_ruong_dat: "Dân Gắn Ruộng",
              ke_ngoai_le: "Kẻ Không Tên"
            },
            actions: [
              {
                mau: "khoc_goi_me", ten_vi: "Khóc gọi mẹ", thoi_luong_mo: "chừng một chốc",
                nguon_goi_y: ["ban_than:so_sinh"], giai_doan: ["so_sinh"],
                nang_luc_yeu_cau: { noi: 0 }, chi_phi: { the_luc: -1, chan: 0, doi: 2 }, ket_qua: {},
                mo_ta: "Cổ họng bạn bật ra tiếng khóc khàn đặc trong gian nhà lạnh ở Tam Giang."
              },
              {
                mau: "bu_me", ten_vi: "Bú mẹ", thoi_luong_mo: "chừng một chốc",
                nguon_goi_y: ["nguoi_xung_quanh:me"], giai_doan: ["so_sinh"],
                nang_luc_yeu_cau: {}, chi_phi: { the_luc: 2, chan: -5, doi: -25 }, ket_qua: {},
                mo_ta: "Hơi ấm từ lòng mẹ và dòng sữa làm cơn đói dịu xuống."
              },
              {
                mau: "nhat_cui_nho", ten_vi: "Nhặt cành củi khô quanh rào", thoi_luong_mo: "chừng nửa buổi",
                nguon_goi_y: ["noi_chon:lang_ngheo", "noi_chon:nha"],
                giai_doan: ["thieu_nhi", "thieu_nien", "truong_thanh", "trung_nien", "gia"],
                nang_luc_yeu_cau: { van_dong: 1 }, chi_phi: { the_luc: -2, chan: 1.5, doi: 1.5 }, ket_qua: { cui: 0.5 },
                mo_ta: "Bạn cúi nhặt từng nhánh củi khô rơi vãi quanh hàng rào trước khi sương xuống."
              },
              {
                mau: "xin_an_hang_xom", ten_vi: "Xin ăn nhà hàng xóm", thoi_luong_mo: "chừng một chốc",
                nguon_goi_y: ["noi_chon:lang_ngheo"], giai_doan: ["thieu_nhi", "gia"],
                nang_luc_yeu_cau: { van_dong: 1, noi: 1 }, chi_phi: { the_luc: -1, chan: 2, doi: -12 }, ket_qua: {},
                mo_ta: "Bạn đứng nép bên bậc cửa nhà hàng xóm, lí nhí xin một vắt cơm nguội."
              },
              {
                mau: "bo_cui", ten_vi: "Bổ củi sau sân", thoi_luong_mo: "chừng nửa buổi",
                nguon_goi_y: ["do_vat:riu"], giai_doan: ["thieu_nien", "truong_thanh", "trung_nien", "gia"],
                nang_luc_yeu_cau: { suc_manh: 1, tay_kheo: 1 }, vat_pham_yeu_cau: ["riu"],
                chi_phi: { the_luc: -3.5, chan: 1.2, doi: 2.0 }, ket_qua: { cui: 1.0 },
                mo_ta: "Lưỡi rìu bổ xuống thớ gỗ khô vang lên tiếng chát chúa giữa sân."
              },
              {
                mau: "gat_lua_lao_dich", ten_vi: "[Nghĩa vụ] Gặt lúa lao dịch cho Chủ Ấp", thoi_luong_mo: "khá lâu",
                nguon_goi_y: ["nghia_vu:lao_dich"], giai_doan: ["thieu_nien", "truong_thanh", "trung_nien"],
                nang_luc_yeu_cau: { suc_manh: 2, van_dong: 2 },
                chi_phi: { the_luc: -4.0, chan: 2.2, doi: 2.5 }, ket_qua: {},
                mo_ta: "Dưới nắng gắt đồng Tam Giang, lưng bạn còng xuống cắt từng lượm lúa nộp thuế Khế."
              },
              {
                mau: "ke_chuyen_cho_chau", ten_vi: "Kể chuyện xưa bên bếp lửa", thoi_luong_mo: "chừng một chốc",
                nguon_goi_y: ["nguoi_xung_quanh:con_chau"], giai_doan: ["trung_nien", "gia"],
                nang_luc_yeu_cau: { noi: 1, tri_nho: 1 }, chi_phi: { the_luc: -0.5, chan: -3, doi: 1 }, ket_qua: {},
                mo_ta: "Bạn ngồi sưởi bên bếp than, chậm rãi kể chuyện Ngày Bát Cháo cho lũ trẻ nghe."
              },
              {
                mau: "doc_so_sach", ten_vi: "Đọc sổ sách và đối chiếu phiếu thuyền", thoi_luong_mo: "chừng nửa buổi",
                nguon_goi_y: ["do_vat:sach"], giai_doan: ["thieu_nhi", "thieu_nien", "truong_thanh", "trung_nien", "gia"],
                nang_luc_yeu_cau: { thi_giac: 2 }, kien_thuc_yeu_cau: ["biet_chu"], vat_pham_yeu_cau: ["sach"],
                chi_phi: { the_luc: -0.8, chan: 1.5, doi: 1 }, ket_qua: {},
                mo_ta: "Bạn lần từng dòng chữ mực tàu trên cuốn sổ, kiểm lại các khoản nợ muối và bạc."
              },
              {
                mau: "nghe_ngong_quan_ruou", ten_vi: "Nghe ngóng lời đồn trong Quán Bốn Ngả", thoi_luong_mo: "chừng nửa buổi",
                nguon_goi_y: ["noi_chon:quan_ruou"], giai_doan: ["thieu_nien", "truong_thanh", "trung_nien", "gia"],
                nang_luc_yeu_cau: { thinh_giac: 2 }, chi_phi: { the_luc: -0.5, chan: -1, doi: 1 }, ket_qua: {},
                mo_ta: "Giữa tiếng bát đĩa lạch cạch, bạn lắng tai nghe khách qua đường bàn về thuế Khế và mỏ Bạch Lĩnh."
              },
              {
                mau: "nam_nghi", ten_vi: "Nằm nghỉ lấy sức (Bản năng)", thoi_luong_mo: "chừng một chốc",
                nguon_goi_y: ["ban_than:moi_trang_thai"],
                giai_doan: ["so_sinh", "au_nhi", "thieu_nhi", "thieu_nien", "truong_thanh", "trung_nien", "gia"],
                nang_luc_yeu_cau: {}, chi_phi: { the_luc: 5, chan: 0.5, doi: 1 }, ket_qua: {},
                mo_ta: "Bạn nằm co mình trên phản gỗ, hít thở sâu để cơ thể dịu bớt cơn mỏi."
              }
            ],
            personas: [
              {
                id: "P1", title: "1. Sơ sinh (1 tuổi)", ten: "Đứa trẻ nông nô mùa gầy (K001)", tuoi: 1, giai_doan: "so_sinh",
                than_phan: "Dân Gắn Ruộng · Làng Sậy Đỏ (Tam Giang)",
                boi_canh_mo_ta: "Bạn mới 1 tuổi, nằm trong lòng mẹ giữa mùa Giá lạnh buốt. Nhà nợ chủ ruộng nửa vụ lúa.",
                noi_chon: ["nha", "lang_ngheo"], do_vat: ["riu"], nguoi_xung_quanh: ["me"], nghia_vu: [], kien_thuc: [],
                luoi: 30, kien_nhan: 50, y_chi: 40, trach_nhiem: 20, hao_mon_suc_manh: 0, mu: false
              },
              {
                id: "P2", title: "2. Mồ côi (8 tuổi)", ten: "Bé Sậy mồ côi (A60)", tuoi: 8, giai_doan: "thieu_nhi",
                than_phan: "Kẻ Không Tên · Bến Sậy (Hạ Giang)",
                boi_canh_mo_ta: "Bạn 8 tuổi, mồ côi sau mùa dịch. Tay còn yếu (sức mạnh bậc 0) chưa cầm nổi rìu lớn, chỉ nhặt củi vụn hoặc xin ăn.",
                noi_chon: ["lang_ngheo", "nha"], do_vat: ["riu"], nguoi_xung_quanh: [], nghia_vu: [], kien_thuc: [],
                luoi: 25, kien_nhan: 65, y_chi: 70, trach_nhiem: 50, hao_mon_suc_manh: 0, mu: false
              },
              {
                id: "P3", title: "3. Nông nô (17 tuổi)", ten: "Khổng Thạch (A13)", tuoi: 17, giai_doan: "thieu_nien",
                than_phan: "Dân Gắn Ruộng · Tam Giang",
                boi_canh_mo_ta: "Bạn 17 tuổi, sức vóc đang lên. Trong sân có cây rìu sắt cũ, trên lưng nặng nghĩa vụ gặt lúa lao dịch.",
                noi_chon: ["nha", "lang_ngheo"], do_vat: ["riu"], nguoi_xung_quanh: [], nghia_vu: ["lao_dich"], kien_thuc: [],
                luoi: 20, kien_nhan: 80, y_chi: 75, trach_nhiem: 75, hao_mon_suc_manh: 0, mu: false
              },
              {
                id: "P4", title: "4. Ông lão (68 tuổi)", ten: "Lão nông Ngô Tam (A14)", tuoi: 68, giai_doan: "gia",
                than_phan: "Trưởng làng già · Làng Sậy Đỏ",
                boi_canh_mo_ta: "Bạn 68 tuổi, lưng và khớp đã hao mòn sau cả đời cày cấy. Quanh bếp lửa có con cháu quây quần.",
                noi_chon: ["nha", "lang_ngheo"], do_vat: [], nguoi_xung_quanh: ["con_chau"], nghia_vu: [], kien_thuc: [],
                luoi: 40, kien_nhan: 85, y_chi: 70, trach_nhiem: 80, hao_mon_suc_manh: 0.45, mu: false
              },
              {
                id: "P5", title: "5. Con nhà buôn (15 tuổi)", ten: "Điền Cẩm Tú (A53)", tuoi: 15, giai_doan: "thieu_nien",
                than_phan: "Thương nhân nhỏ · Cửa hiệu Hạ Giang",
                boi_canh_mo_ta: "Bạn 15 tuổi, được học chữ từ nhỏ. Trên bàn có cuốn sổ muối và tập sách ghi chép lãi chìm.",
                noi_chon: ["cua_hieu", "quan_ruou"], do_vat: ["sach"], nguoi_xung_quanh: [], nghia_vu: [], kien_thuc: ["biet_chu"],
                luoi: 35, kien_nhan: 75, y_chi: 65, trach_nhiem: 70, hao_mon_suc_manh: 0, mu: false
              },
              {
                id: "P6", title: "6. Khách mù (30 tuổi)", ten: "Người hát rong mù (K117)", tuoi: 30, giai_doan: "truong_thanh",
                than_phan: "Kẻ Không Tên · Quán Bốn Ngả (Bến Bắc)",
                boi_canh_mo_ta: "Đôi mắt bạn mù hoàn toàn nên bị chặn việc đọc sách, nhưng đôi tai cực nhạy với mọi lời đồn trong quán rượu.",
                noi_chon: ["quan_ruou"], do_vat: ["sach"], nguoi_xung_quanh: [], nghia_vu: [], kien_thuc: ["biet_chu"],
                luoi: 30, kien_nhan: 80, y_chi: 80, trach_nhiem: 60, hao_mon_suc_manh: 0, mu: true
              }
            ]
          };
          writeFile('assets/resources/data/world/tu_dien.json', worldAndActions, true);

          // 4. Tạo bản chơi trực tiếp trên Web / Điện thoại (GitHub Pages tại thư mục docs/)
          const htmlContent = `<!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Thiên Mệnh Khả Biến (Fate Unfixed) - Bản Chơi Thử GĐ1</title>
            <style>
              body { background: #121316; color: #e8e6e3; font-family: "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; display: flex; justify-content: center; }
              .container { max-width: 820px; width: 100%; background: #1b1d22; border: 1px solid #32363f; border-radius: 8px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
              h1 { font-size: 20px; color: #ffd982; margin-top: 0; margin-bottom: 12px; }
              .persona-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #2d3139; }
              .persona-btn { background: #26332c; color: #9ef0b6; border: 1px solid #3c5c4a; padding: 7px 11px; border-radius: 5px; cursor: pointer; font-size: 13px; }
              .persona-btn.active { background: #3c6e52; color: #fff; font-weight: bold; }
              .feel-box { background: #15171b; border-left: 3px solid #d4a359; padding: 10px 14px; font-size: 14px; color: #c7c4be; margin-bottom: 16px; line-height: 1.5; }
              .narrative-box { background: #141519; border: 1px solid #2b2e37; border-radius: 6px; padding: 16px; min-height: 130px; font-size: 16px; line-height: 1.6; white-space: pre-line; margin-bottom: 18px; }
              .action-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
              .action-btn { flex: 1; text-align: left; background: #222936; color: #dcebff; border: 1px solid #3b4b66; padding: 11px 14px; border-radius: 6px; cursor: pointer; font-size: 15px; }
              .action-btn:hover { background: #2c374b; }
              .push-btn { background: #3d261e; color: #ffbe8c; border: 1px solid #6b3e2e; padding: 11px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
              .push-btn:hover { background: #523227; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1 id="headerTitle">THIÊN MỆNH KHẢ BIẾN</h1>
              <div class="persona-bar" id="personaBar"></div>
              <div class="feel-box" id="feelBox"></div>
              <div class="narrative-box" id="narrativeBox"></div>
              <div id="menuBox"></div>
            </div>
            <script>
              const CONFIG = ${JSON.stringify(gameConfig)};
              const DATA = ${JSON.stringify(worldAndActions)};
              let currentIdx = 2;
              let theLuc = 80, doi = 35, chan = 10, cui = 2;
              let tiers = {};

              function calcTiers(p) {
                tiers = {};
                for (const [k, cfg] of Object.entries(CONFIG.f_tuoi)) {
                  if (k === 'thi_giac' && p.mu) { tiers[k] = 0; continue; }
                  const age = Math.max(0.2, p.tuoi);
                  const fTang = Math.min(1, Math.pow(age / cfg.tuoi_dinh, cfg.q));
                  const fGiam = p.tuoi <= cfg.tuoi_suy ? 1 : Math.max(cfg.san_gia, 1 / (1 + Math.pow((p.tuoi - cfg.tuoi_suy) / (cfg.tuoi_nua - cfg.tuoi_suy), cfg.p)));
                  const haoMon = k === 'suc_manh' ? (p.hao_mon_suc_manh || 0) : 0;
                  const val = 65 * fTang * fGiam * (1 - haoMon);
                  tiers[k] = Math.max(0, Math.min(5, Math.floor(val / 20)));
                }
              }

              function getMenu(p) {
                const sources = new Set(['ban_than:moi_trang_thai']);
                if (p.giai_doan === 'so_sinh') sources.add('ban_than:so_sinh');
                p.noi_chon.forEach(s => sources.add('noi_chon:' + s));
                p.do_vat.forEach(s => sources.add('do_vat:' + s));
                p.nguoi_xung_quanh.forEach(s => sources.add('nguoi_xung_quanh:' + s));
                p.nghia_vu.forEach(s => sources.add('nghia_vu:' + s));

                return DATA.actions.filter(tpl => {
                  if (!tpl.nguon_goi_y.some(s => sources.has(s))) return false;
                  if (!tpl.giai_doan.includes(p.giai_doan)) return false;
                  for (const [ab, minT] of Object.entries(tpl.nang_luc_yeu_cau)) {
                    if ((tiers[ab] ?? 0) < minT) return false;
                  }
                  if (tpl.vat_pham_yeu_cau && !tpl.vat_pham_yeu_cau.every(i => p.do_vat.includes(i))) return false;
                  if (tpl.kien_thuc_yeu_cau && !tpl.kien_thuc_yeu_cau.every(k => p.kien_thuc.includes(k))) return false;
                  return true;
                });
              }

              function runAction(tpl, isPush) {
                const p = DATA.personas[currentIdx];
                const sr = CONFIG.stopping_rule;
                let beats = 0, reason = 'hoan_thanh';
                const boost = isPush ? sr.push_through_boost : 0;

                while (beats < 12) {
                  beats++;
                  theLuc = Math.max(0, Math.min(100, theLuc + tpl.chi_phi.the_luc));
                  chan = Math.max(0, Math.min(100, chan + tpl.chi_phi.chan));
                  doi = Math.max(0, Math.min(100, doi + tpl.chi_phi.doi));
                  if (tpl.ket_qua.cui) cui += tpl.ket_qua.cui;
                  if (theLuc <= 5) { reason = 'kiet_suc'; break; }

                  const khoChiu = (100 - theLuc) * 0.65 + chan * 0.7 + doi * 0.45;
                  const nguong = sr.base_threshold + p.luoi * sr.weight_luoi + p.kien_nhan * sr.weight_kien_nhan + p.y_chi * sr.weight_y_chi + p.trach_nhiem * sr.weight_trach_nhiem + boost + (Math.random() * 10 - 5);
                  if (khoChiu > nguong && tpl.mau !== 'nam_nghi') { reason = 'ngat_noi_tam'; break; }
                }

                let rText = 'Bạn làm trọn vẹn phần việc trước mắt.';
                if (reason === 'kiet_suc') rText = 'Tay bạn run bần bật, hơi thở đứt quãng không sao tiếp tục nổi nữa.';
                else if (reason === 'ngat_noi_tam') rText = doi > 60 ? 'Bụng cồn cào khiến bạn chẳng còn chút kiên nhẫn nào, đành tự dừng tay.' : 'Cơn mỏi và sự bức bối dâng lên khiến bạn tự giác dừng lại nghỉ.';

                document.getElementById('narrativeBox').textContent =
                  (isPush ? '[Gắng gượng nghiến răng làm tiếp] ' : '') + tpl.mo_ta +
                  '\\n\\n• Diễn biến: Thực hiện ' + beats + ' nhịp (~' + (beats * 6) + ' phút).' +
                  '\\n• Cảm nhận nội tâm: ' + rText;
                render();
              }

              function selectPersona(idx) {
                currentIdx = idx;
                theLuc = 80; doi = 35; chan = 10; cui = 2;
                const p = DATA.personas[idx];
                calcTiers(p);
                document.getElementById('narrativeBox').textContent =
                  '[NHẬP XÁC: ' + p.ten.toUpperCase() + ']\\n' + p.boi_canh_mo_ta +
                  '\\n\\nHãy chọn một hành động bên dưới (menu được sinh tự động theo độ tuổi, bậc năng lực và đồ vật quanh bạn):';
                render();
              }

              function render() {
                const p = DATA.personas[currentIdx];
                document.getElementById('headerTitle').textContent = 'THIÊN MỆNH KHẢ BIẾN · ' + p.ten + ' (' + p.tuoi + ' tuổi) · ' + p.than_phan;

                const bar = document.getElementById('personaBar');
                bar.innerHTML = '';
                DATA.personas.forEach((item, idx) => {
                  const b = document.createElement('button');
                  b.className = 'persona-btn' + (idx === currentIdx ? ' active' : '');
                  b.textContent = item.title;
                  b.onclick = () => selectPersona(idx);
                  bar.appendChild(b);
                });

                const fTheLuc = theLuc > 65 ? 'Cơ thể dẻo dai' : (theLuc > 30 ? 'Bắt đầu thấm mệt' : 'Chân tay rã rời, nặng như chì');
                const fDoi = doi < 35 ? 'Bụng êm' : (doi < 70 ? 'Bụng hơi cồn cào' : 'Đói hoa mắt, bụng thắt lại');
                const fChan = chan < 35 ? 'Tâm trí bình ổn' : (chan < 70 ? 'Hơi uể oải, bức bối' : 'Chán ngán tột cùng');
                document.getElementById('feelBox').textContent =
                  'Cảm nhận cơ thể (Ẩn thanh chỉ số): ' + fTheLuc + ' | ' + fDoi + ' | ' + fChan + ' | Củi dự trữ: ' + Math.floor(cui) + ' bó';

                const menu = document.getElementById('menuBox');
                menu.innerHTML = '';
                getMenu(p).forEach(tpl => {
                  const row = document.createElement('div');
                  row.className = 'action-row';
                  const btn = document.createElement('button');
                  btn.className = 'action-btn';
                  btn.textContent = '▶ ' + tpl.ten_vi + ' (' + tpl.thoi_luong_mo + ')';
                  btn.onclick = () => runAction(tpl, false);
                  row.appendChild(btn);

                  if (tpl.mau !== 'nam_nghi' && tpl.mau !== 'bu_me') {
                    const pBtn = document.createElement('button');
                    pBtn.className = 'push-btn';
                    pBtn.textContent = 'Gắng gượng';
                    pBtn.onclick = () => runAction(tpl, true);
                    row.appendChild(pBtn);
                  }
                  menu.appendChild(row);
                });
              }

              selectPersona(2);
            </script>
          </body>
          </html>`;
          writeFile('docs/index.html', htmlContent);

          // 5. Tạo bộ kiểm thử tự động chạy trên GitHub Actions (Mục 38.2 & 42.4)
          const testScript = `
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('assets/resources/data/config/game_config.json', 'utf8'));
          const data = JSON.parse(fs.readFileSync('assets/resources/data/world/tu_dien.json', 'utf8'));

          function calcTiers(p) {
            const tiers = {};
            for (const [k, c] of Object.entries(cfg.f_tuoi)) {
              if (k === 'thi_giac' && p.mu) { tiers[k] = 0; continue; }
              const age = Math.max(0.2, p.tuoi);
              const fTang = Math.min(1, Math.pow(age / c.tuoi_dinh, c.q));
              const fGiam = p.tuoi <= c.tuoi_suy ? 1 : Math.max(c.san_gia, 1 / (1 + Math.pow((p.tuoi - c.tuoi_suy) / (c.tuoi_nua - c.tuoi_suy), c.p)));
              const haoMon = k === 'suc_manh' ? (p.hao_mon_suc_manh || 0) : 0;
              tiers[k] = Math.max(0, Math.min(5, Math.floor((65 * fTang * fGiam * (1 - haoMon)) / 20)));
            }
            return tiers;
          }

          function getMenuIds(p) {
            const tiers = calcTiers(p);
            const sources = new Set(['ban_than:moi_trang_thai']);
            if (p.giai_doan === 'so_sinh') sources.add('ban_than:so_sinh');
            p.noi_chon.forEach(s => sources.add('noi_chon:' + s));
            p.do_vat.forEach(s => sources.add('do_vat:' + s));
            p.nguoi_xung_quanh.forEach(s => sources.add('nguoi_xung_quanh:' + s));
            p.nghia_vu.forEach(s => sources.add('nghia_vu:' + s));

            return data.actions.filter(tpl => {
              if (!tpl.nguon_goi_y.some(s => sources.has(s))) return false;
              if (!tpl.giai_doan.includes(p.giai_doan)) return false;
              for (const [ab, minT] of Object.entries(tpl.nang_luc_yeu_cau)) {
                if ((tiers[ab] ?? 0) < minT) return false;
              }
              if (tpl.vat_pham_yeu_cau && !tpl.vat_pham_yeu_cau.every(i => p.do_vat.includes(i))) return false;
              if (tpl.kien_thuc_yeu_cau && !tpl.kien_thuc_yeu_cau.every(k => p.kien_thuc.includes(k))) return false;
              return true;
            }).map(a => a.mau);
          }

          function assert(cond, msg) {
            if (!cond) { console.error('[THẤT BẠI] ' + msg); process.exit(1); }
            console.log('[ĐẠT] ' + msg);
          }

          console.log('--- CHẠY KIỂM THỬ THỰC TẠI GĐ1 TRÊN GITHUB ACTIONS ---');
          const [p1, p2, p3, p4, p5, p6] = data.personas;
          assert(getMenuIds(p1).includes('bu_me') && !getMenuIds(p1).includes('bo_cui'), 'Persona 1 (Sơ sinh): Có bú mẹ, không có bổ củi');
          assert(getMenuIds(p2).includes('nhat_cui_nho') && !getMenuIds(p2).includes('bo_cui'), 'Persona 2 (Bé 8 tuổi mồ côi): Sức mạnh bậc 0 chỉ nhặt củi nhỏ, không bổ củi');
          assert(getMenuIds(p3).includes('bo_cui') && getMenuIds(p3).includes('gat_lua_lao_dich'), 'Persona 3 (Trai 17 nông nô): Có bổ củi và gặt lúa lao dịch');
          assert(getMenuIds(p4).includes('ke_chuyen_cho_chau'), 'Persona 4 (Ông lão 68 tuổi): Có kể chuyện cho cháu');
          assert(getMenuIds(p5).includes('doc_so_sach'), 'Persona 5 (Con nhà buôn biết chữ): Có đọc sổ sách');
          assert(getMenuIds(p6).includes('nghe_ngong_quan_ruou') && !getMenuIds(p6).includes('doc_so_sach'), 'Persona 6 (Khách mù): Nghe ngóng được ở quán rượu nhưng bị chặn đọc sách');
          `;
          writeFile('tests/run_reality_tests.js', testScript);
          EOF
          node generate_project.js
          rm generate_project.js

      - name: Chạy Bộ kiểm thử thực tại Giai đoạn 1
        run: node tests/run_reality_tests.js

      - name: Lưu toàn bộ thư mục vừa tạo vào GitHub Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-generate Cocos Creator structure, Hoai Duong data & Web preview"
          git push
