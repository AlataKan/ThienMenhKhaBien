name: Auto Setup Cocos Creator & Web Preview (Stage 2 & 3)

on:
  push:
    paths:
      - '.github/workflows/setup_cocos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Nâng cấp lên Giai đoạn 2 & 3 (Sinh tồn, Dự báo số phận, Cảnh gấp, Tua tuổi thơ & Cốt truyện Hoài Dương)
        run: |
          cat << 'EOF' > generate_project.js
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          function writeFile(filePath, content, createCocosMeta = false) {
            const dir = path.dirname(filePath);
            fs.mkdirSync(dir, { recursive: true });
            const data = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
            fs.writeFileSync(filePath, data, 'utf8');
            if (createCocosMeta && !fs.existsSync(filePath + '.meta')) {
              const uuid = crypto.randomUUID();
              fs.writeFileSync(filePath + '.meta', JSON.stringify({ ver: "1.0.0", uuid, importer: "auto" }, null, 2), 'utf8');
            }
          }

          // 1. Cấu hình công thức GĐ1 + GĐ2 + GĐ3 (Mục 10, 11, 20, 29, 36.1, 39, 43, 47.3)
