              .btn-random { background: #4a2c6b; color: #f3e6ff; border: 1px solid #7748a8; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
              .btn-random:hover { background: #5e3887; }
              .toggle-authentic { background: #2b2222; color: #ffadad; border: 1px solid #5c3535; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
              .toggle-authentic.on { background: #6e2222; color: #fff; border-color: #ff6b6b; font-weight: bold; }
              .persona-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #282c34; }
              .persona-btn { background: #222e28; color: #9ef0b6; border: 1px solid #355242; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12.5px; }
              .persona-btn.active { background: #36694c; color: #fff; font-weight: bold; }
              .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
              @media (max-width: 680px) { .grid-info { grid-template-columns: 1fr; } }
              .info-card { background: #131519; border: 1px solid #272b33; border-radius: 6px; padding: 10px 12px; font-size: 13.5px; line-height: 1.5; }
              .info-card strong { color: #f0c674; }
              .fate-banner { padding: 9px 12px; border-radius: 6px; font-size: 13.5px; margin-bottom: 12px; font-weight: 500; border-left: 4px solid #d4a359; background: #1e1c17; color: #f7dca1; }
              .fate-banner.safe { border-left-color: #4ec978; background: #16241c; color: #a8f5c2; }
              .fate-banner.danger { border-left-color: #e05a47; background: #261717; color: #ffb3a7; }
              .frenetic-box { display: none; background: #2d1616; border: 2px solid #ff5c5c; border-radius: 8px; padding: 14px; margin-bottom: 14px; animation: pulse 1s infinite alternate; }
              @keyframes pulse { from { box-shadow: 0 0 4px #ff5c5c44; } to { box-shadow: 0 0 14px #ff5c5caa; } }
              .frenetic-title { color: #ff9494; font-weight: bold; font-size: 16px; margin-bottom: 6px; display: flex; justify-content: space-between; }
              .narrative-box { background: #121317; border: 1px solid #2b2f38; border-radius: 6px; padding: 14px 16px; min-height: 125px; font-size: 15.5px; line-height: 1.6; white-space: pre-line; margin-bottom: 14px; }
              .stance-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #151921; border: 1px solid #283242; padding: 9px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
              .stance-select { background: #1f2633; color: #fff; border: 1px solid #3c4c66; padding: 5px 8px; border-radius: 4px; font-size: 13px; }
              .btn-skip { background: #2b394f; color: #b8d8ff; border: 1px solid #455d82; padding: 6px 11px; border-radius: 5px; cursor: pointer; font-size: 13px; }
              .btn-skip:hover { background: #384b69; }
              .btn-endlife { background: #33271e; color: #f2c894; border: 1px solid #594331; padding: 6px 11px; border-radius: 5px; cursor: pointer; font-size: 13px; margin-left: auto; }
              .action-group-title { font-size: 13px; color: #9aa4b5; text-transform: uppercase; letter-spacing: 0.5px; margin: 10px 0 6px 0; }
              .action-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
              .action-btn { flex: 1; text-align: left; background: #202733; color: #dcebff; border: 1px solid #38475e; padding: 10px 13px; border-radius: 6px; cursor: pointer; font-size: 14.5px; }
              .action-btn:hover { background: #2b3547; }
              .push-btn { background: #3b241c; color: #ffbe8c; border: 1px solid #693d2e; padding: 10px 11px; border-radius: 6px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
              .push-btn:hover { background: #523227; }
              .chronicle-modal { display: none; background: #141210; border: 2px solid #c99c52; border-radius: 8px; padding: 18px; margin-top: 14px; line-height: 1.6; }
              .chronicle-modal h2 { color: #ffd982; margin-top: 0; font-size: 18px; }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="top-row">
                <h1 id="headerTitle">THIÊN MỆNH KHẢ BIẾN</h1>
                <div class="top-controls">
                  <button class="btn-random" id="btnRandomDraw">🎲 Bốc Kiếp Sống Ngẫu Nhiên (Năm 0–200)</button>
                  <button class="toggle-authentic" id="btnAuthentic">Chế độ Chân thực: TẮT</button>
                </div>
              </div>

              <div class="persona-bar" id="personaBar"></div>

              <div class="grid-info">
                <div class="info-card" id="worldClockCard"></div>
                <div class="info-card" id="personalStoryCard"></div>
              </div>

              <div class="fate-banner" id="fateBanner"></div>

              <div class="frenetic-box" id="freneticBox">
                <div class="frenetic-title">
                  <span id="freneticTitle">CẢNH GẤP!</span>
                  <span id="freneticTimer">08.0s</span>
                </div>
                <div id="freneticDesc" style="margin-bottom:10px; font-size:14.5px;"></div>
                <div id="freneticChoices"></div>
              </div>

              <div class="narrative-box" id="narrativeBox"></div>

              <div class="stance-bar">
                <span><strong>Thiên hướng khi tua (Mục 39.3):</strong></span>
                <select class="stance-select" id="stanceSelect">
                  <option value="can_than">Tích trữ & Giữ sức qua mùa</option>
                  <option value="cham_chi">Chăm chỉ rèn nghề / Phụ việc</option>
                  <option value="nghe_ngong">Lang thang nghe ngóng dấu vết</option>
                  <option value="bam_gia_dinh">Bám sát người thân & Tìm thuốc</option>
                </select>
                <button class="btn-skip" id="btnSkipBeat">⏩ Tua tới Điểm Ngắt Kế Tiếp (+3 ngày)</button>
                <button class="btn-endlife" id="btnShowChronicle">📜 Xem Cáo Phó & Tổng Kết Đời</button>
              </div>

              <div id="menuBox"></div>

              <div class="chronicle-modal" id="chronicleModal"></div>
            </div>

            <script>
              const CONFIG = __CONFIG_JSON__;
              const DATA = __DATA_JSON__;

              let state = {
                persona: null,
                hour: 7,
                dayInSeason: 12,
                seasonIdx: 3, // Mặc định mùa Giá (Đông) để kiểm thử sinh tồn Mục 10
                year: 45,
                theLuc: 80,
                sucKhoe: 85,
                doi: 45,
                lanh: 40,
                chan: 10,
                so: 10,
                cui: 1.0,
                luongThuc: 1.2,
                amAnhDoi: 0,
                talentRevealed: false,
                initialDangerDays: null,
                actionsTaken: 0,
                cluesFound: [],
                authenticMode: false,
                lastCompletedClass: null
              };

              let freneticInterval = null;
              let tiers = {};

              function calcTiers(p) {
                tiers = {};
                for (const [k, cfg] of Object.entries(CONFIG.f_tuoi)) {
                  if (k === 'thi_giac' && p.mu) { tiers[k] = 0; continue; }
                  const age = Math.max(0.2, p.tuoi);
                  const fTang = Math.min(1, Math.pow(age / cfg.tuoi_dinh, cfg.q));
                  const fGiam = p.tuoi <= cfg.tuoi_suy ? 1 : Math.max(cfg.san_gia, 1 / (1 + Math.pow((p.tuoi - cfg.tuoi_suy) / (cfg.tuoi_nua - cfg.tuoi_suy), cfg.p)));
                  const haoMon = k === 'suc_manh' ? (p.hao_mon_suc_manh || 0) : 0;
                  const val = 65 * fTang * fGiam * (1 - haoMon);
                  tiers[k] = Math.max(0, Math.min(5, Math.floor(val / 20)));
                }
              }

              function predictFate() {
                let sDoi = state.doi, sLanh = state.lanh, sSK = state.sucKhoe;
                let sCui = state.cui, sFood = state.luongThuc;
                const isWinter = state.seasonIdx === 3;
                let dangerDay = null, cause = 'An toàn';

                for (let d = 1; d <= 14; d++) {
                  if (sFood >= 0.8) { sFood -= 0.8; sDoi = Math.max(10, sDoi - 20); }
                  else if (sFood > 0) { sDoi = Math.max(20, sDoi - sFood * 20 + 12); sFood = 0; }
                  else { sDoi += 22; }

                  if (isWinter) {
                    if (sCui >= 0.8) { sCui -= 0.8; sLanh = Math.max(10, sLanh - 15); }
                    else { sCui = 0; sLanh += 25; }
                  } else {
                    sLanh = Math.max(0, sLanh - 10);
                  }

                  if (sDoi >= 95) sSK -= 28;
                  else if (sDoi >= 75) sSK -= 12;

                  if (sLanh >= 95) sSK -= 30;
                  else if (sLanh >= 75) sSK -= 14;

                  if (sSK <= 0) {
                    dangerDay = d;
                    cause = sDoi >= sLanh ? 'Kiệt sức vì đói' : 'Nhiễm lạnh đêm mùa Giá';
                    break;
                  }
                }
                return { dangerDay, cause };
              }

              function advanceClock(minutes) {
                const hours = minutes / 60;
                const prevHour = state.hour;
                state.hour += hours;

                // Tăng nhu cầu nền theo thời gian (Mục 7.1)
                state.doi = Math.min(100, state.doi + hours * CONFIG.survival.hourly_hunger_gain);
                const isNight = (prevHour >= 18 || prevHour < 6);
                const isWinter = state.seasonIdx === 3;

                if (isWinter) {
                  state.lanh = Math.min(100, state.lanh + hours * (isNight ? 4.5 : 2.0));
                }

                // Qua đêm: tự động đốt 1 bó củi để giữ ấm
                if (state.hour >= 24) {
                  const daysPassed = Math.floor(state.hour / 24);
                  state.hour = state.hour % 24;
                  state.dayInSeason += daysPassed;

                  for (let i = 0; i < daysPassed; i++) {
                    if (state.cui >= 1.0) {
                      state.cui -= 1.0;
                      state.lanh = Math.max(10, state.lanh - 25);
                    } else if (state.seasonIdx === 3) {
                      state.lanh = Math.min(100, state.lanh + 25);
                      state.sucKhoe = Math.max(0, state.sucKhoe - 8);
                    }
                    if (state.luongThuc >= 0.8 && state.doi > 45) {
                      state.luongThuc -= 0.8;
                      state.doi = Math.max(15, state.doi - 30);
                    }
                  }

                  if (state.dayInSeason > CONFIG.time.days_per_season) {
                    state.dayInSeason = 1;
                    state.seasonIdx = (state.seasonIdx + 1) % 4;
                    if (state.seasonIdx === 0) {
                      state.year++;
                      state.persona.tuoi++;
                      calcTiers(state.persona);
                    }
                  }
                }

                // Hình thành Ám ảnh tâm lý khi suýt chết đói/lạnh (Mục 29.2)
                if ((state.doi >= 80 || state.lanh >= 80) && state.amAnhDoi < 70) {
                  state.amAnhDoi = 75;
                }
              }

              function getMenu(p) {
                const sources = new Set(['ban_than:moi_trang_thai']);
                if (p.giai_doan === 'so_sinh') sources.add('ban_than:so_sinh');
                if (state.lanh >= 35 || state.seasonIdx === 3) sources.add('thoi_diem:lanh');
                if (state.seasonIdx === 3 && state.dayInSeason <= 3) sources.add('thoi_diem:ngay_bat_chao');

                p.noi_chon.forEach(s => sources.add('noi_chon:' + s));
                p.do_vat.forEach(s => sources.add('do_vat:' + s));
                if (state.cui >= 1) sources.add('do_vat:cui');
                if (state.luongThuc >= 1) sources.add('do_vat:luong_thuc');
                p.nguoi_xung_quanh.forEach(s => sources.add('nguoi_xung_quanh:' + s));
                p.nghia_vu.forEach(s => sources.add('nghia_vu:' + s));

                const isDaylight = state.hour >= 6 && state.hour < 18;
                const remDaylightHours = isDaylight ? (18 - state.hour) : 0;

                return DATA.actions.filter(tpl => {
                  if (!tpl.nguon_goi_y.some(s => sources.has(s))) return false;
                  if (!tpl.giai_doan.includes(p.giai_doan)) return false;
                  if (tpl.can_anh_sang && !isDaylight) return false;
                  if (tpl.gio_toi_thieu_con_lai && remDaylightHours < tpl.gio_toi_thieu_con_lai) return false;

                  for (const [ab, minT] of Object.entries(tpl.nang_luc_yeu_cau)) {
                    if ((tiers[ab] ?? 0) < minT) return false;
                  }
                  if (tpl.vat_pham_yeu_cau && !tpl.vat_pham_yeu_cau.every(i => p.do_vat.includes(i))) return false;
                  if (tpl.vat_pham_tieu_hao) {
                    if (tpl.vat_pham_tieu_hao.cui && state.cui < tpl.vat_pham_tieu_hao.cui) return false;
                    if (tpl.vat_pham_tieu_hao.luong_thuc && state.luongThuc < tpl.vat_pham_tieu_hao.luong_thuc) return false;
                  }
                  if (tpl.kien_thuc_yeu_cau && !tpl.kien_thuc_yeu_cau.every(k => p.kien_thuc.includes(k))) return false;
                  return true;
                }).map(tpl => {
                  // Tính điểm xếp hạng (Mục 7.2 + Lực kéo ám ảnh Mục 29.3)
                  let score = 20;
                  const tags = tpl.tag || [];
                  if (tags.includes('thuc_pham')) score += state.doi * 0.8;
                  if (tags.includes('tich_tru') && state.amAnhDoi > 0) score += (state.amAnhDoi / 100) * 45;
                  if (tags.includes('nghia_vu')) score += 30;
                  return { ...tpl, score };
                }).sort((a, b) => b.score - a.score);
              }

              function runAction(tpl, isPush) {
                if (freneticInterval) return;
                const p = state.persona;
                const sr = CONFIG.stopping_rule;
                const maxBeats = tpl.so_nhip_chuan || 6;
                let beats = 0, reason = 'hoan_thanh';
                const boost = isPush ? sr.push_through_boost : 0;

                if (tpl.vat_pham_tieu_hao) {
                  if (tpl.vat_pham_tieu_hao.cui) state.cui = Math.max(0, state.cui - tpl.vat_pham_tieu_hao.cui);
                  if (tpl.vat_pham_tieu_hao.luong_thuc) state.luongThuc = Math.max(0, state.luongThuc - tpl.vat_pham_tieu_hao.luong_thuc);
                }

                let gainedCui = 0, gainedFood = 0;

                while (beats < maxBeats) {
                  beats++;
                  state.theLuc = Math.max(0, Math.min(100, state.theLuc + tpl.chi_phi.the_luc));
                  state.chan = Math.max(0, Math.min(100, state.chan + tpl.chi_phi.chan));
                  state.doi = Math.max(0, Math.min(100, state.doi + tpl.chi_phi.doi));

                  if (tpl.ket_qua.cui) { state.cui += tpl.ket_qua.cui; gainedCui += tpl.ket_qua.cui; }
                  if (tpl.ket_qua.luong_thuc) { state.luongThuc += tpl.ket_qua.luong_thuc; gainedFood += tpl.ket_qua.luong_thuc; }
                  if (tpl.ket_qua.lanh) state.lanh = Math.max(0, Math.min(100, state.lanh + tpl.ket_qua.lanh));
                  if (tpl.ket_qua.suc_khoe) state.sucKhoe = Math.max(0, Math.min(100, state.sucKhoe + tpl.ket_qua.suc_khoe));

                  if (state.theLuc <= 4) { reason = 'kiet_suc'; break; }

                  const khoChiu = (100 - state.theLuc) * 0.65 + state.chan * 0.7 + state.doi * 0.4 + state.lanh * 0.35;
                  const nguong = sr.base_threshold + p.luoi * sr.weight_luoi + p.kien_nhan * sr.weight_kien_nhan + p.y_chi * sr.weight_y_chi + p.trach_nhiem * sr.weight_trach_nhiem + boost + (Math.random() * 8 - 4);
                  if (khoChiu > nguong && !tpl.tag.includes('ban_nang') && !tpl.tag.includes('sinh_ton')) {
                    reason = 'ngat_noi_tam';
                    break;
                  }
                }

                if (isPush) {
                  state.sucKhoe = Math.max(5, state.sucKhoe - 3);
                }

                const minutes = beats * 6;
                advanceClock(minutes);
                state.actionsTaken++;

                let extraNotes = [];
                if (gainedCui > 0) extraNotes.push('Thu được +' + gainedCui.toFixed(1) + ' bó củi.');
                if (gainedFood > 0) extraNotes.push('Thu được +' + gainedFood.toFixed(1) + ' phần lương thực.');

                // Bộc lộ thiên phú ẩn lần đầu (Mục 43.6 & 43.7)
                if (!state.talentRevealed && p.thien_phu_noi_bat && state.actionsTaken >= 2) {
                  state.talentRevealed = true;
                  extraNotes.push('✨ [Bộc lộ Thiên phú ẩn - ' + p.thien_phu_noi_bat.ten + ']: ' + p.thien_phu_noi_bat.cau_bo_lo);
                }

                // Rò rỉ dấu vết Sương mù thông tin (Mục 35 & 54.2)
                if (tpl.ket_qua.manh_moi || Math.random() < 0.25) {
                  const trace = DATA.rumor_traces[state.actionsTaken % DATA.rumor_traces.length];
                  if (!state.cluesFound.includes(trace)) state.cluesFound.push(trace);
                  extraNotes.push('🌫️ [Sương mù thông tin]: ' + trace);
                }

                let rText = 'Bạn hoàn thành trọn vẹn công việc.';
                if (reason === 'kiet_suc') rText = 'Tay bạn run bần bật, hơi thở đứt quãng không sao tiếp tục nổi nữa.';
                else if (reason === 'ngat_noi_tam') rText = state.doi > 65 ? 'Bụng cồn cào khiến bạn chẳng còn chút kiên nhẫn nào, đành tự dừng tay.' : 'Cơn mỏi và sự bức bối dâng lên khiến bạn tự giác dừng lại nghỉ.';

                document.getElementById('narrativeBox').textContent =
                  (isPush ? '[Gắng gượng nghiến răng làm tiếp] ' : '') + tpl.mo_ta +
                  '\\n\\n• Diễn biến: Làm ' + beats + ' nhịp (~' + minutes + ' phút). ' + extraNotes.join(' ') +
                  '\\n• Cảm nhận nội tâm: ' + rText;

                // Xác suất kích hoạt Cảnh gấp tính giờ (Mục 20)
                if (state.actionsTaken % 4 === 0 && p.giai_doan !== 'so_sinh') {
                  triggerFreneticScene();
                }

                saveToLocal();
                render();
              }

              // Cảnh gấp tính giờ (Mục 20)
              function triggerFreneticScene() {
                const ev = DATA.frenetic_events[state.actionsTaken % DATA.frenetic_events.length];
                const box = document.getElementById('freneticBox');
                const titleEl = document.getElementById('freneticTitle');
                const timerEl = document.getElementById('freneticTimer');
                const descEl = document.getElementById('freneticDesc');
                const choicesEl = document.getElementById('freneticChoices');

                const p = state.persona;
                let totalSec = CONFIG.frenetic.base_seconds - state.so * 0.04 + (p.can_dam || 50) * 0.05;
                totalSec = Math.max(CONFIG.frenetic.min_seconds, Math.min(CONFIG.frenetic.max_seconds, totalSec));
                let remSec = totalSec;

                titleEl.textContent = ev.tieu_de;
                descEl.textContent = ev.mo_ta;
                choicesEl.innerHTML = '';

                ev.choices.forEach(ch => {
                  const btn = document.createElement('button');
                  btn.className = 'action-btn';
                  btn.style.marginBottom = '6px';
                  btn.style.width = '100%';
                  btn.textContent = '⚡ ' + ch.text;
                  btn.onclick = () => resolveFrenetic(ch, false);
                  choicesEl.appendChild(btn);
                });

                box.style.display = 'block';
                freneticInterval = setInterval(() => {
                  remSec -= 0.1;
                  timerEl.textContent = Math.max(0, remSec).toFixed(1) + 's';
                  if (remSec <= 0) {
                    // Hết giờ: tự chọn theo bản năng tính cách (Mục 20)
                    const autoChoice = (p.can_dam || 50) >= 60 ? ev.choices[0] : ev.choices[1];
                    resolveFrenetic(autoChoice, true);
                  }
                }, 100);
              }

              function resolveFrenetic(choice, isAutoTimeout) {
                clearInterval(freneticInterval);
                freneticInterval = null;
                document.getElementById('freneticBox').style.display = 'none';

                state.theLuc = Math.max(0, Math.min(100, state.theLuc + (choice.the_luc || 0)));
                state.sucKhoe = Math.max(5, Math.min(100, state.sucKhoe + (choice.suc_khoe || 0)));
                if (choice.cui) state.cui = Math.max(0, state.cui + choice.cui);
                if (choice.luong_thuc) state.luongThuc = Math.max(0, state.luongThuc + choice.luong_thuc);

                const prefix = isAutoTimeout ? '[HẾT GIỜ - PHẢN XẠ BẢN NĂNG]: Bạn đứng sững một nhịp rồi cơ thể tự hành động! ' : '[PHẢN ỨNG KỊP THỜI]: ';
                document.getElementById('narrativeBox').textContent = prefix + choice.ket_qua_text;
                render();
              }

              // Tua theo Điểm ngắt và Thiên hướng (Mục 39)
              function skipToNextBeat() {
                if (freneticInterval) return;
                const stance = document.getElementById('stanceSelect').value;
                advanceClock(24 * 60 * 3); // Tua 3 ngày tới điểm ngắt kế tiếp

                let beatMsg = '';
                if (stance === 'can_than') {
                  state.cui += 2.2;
                  state.luongThuc += 1.8;
                  state.theLuc = Math.min(100, state.theLuc + 15);
                  beatMsg = '[Tua Chương - Thiên hướng Tích trữ]: Suốt 3 ngày qua bạn cần mẫn gom củi và giữ sức. Kho dự trữ tăng thêm +2.2 bó củi, +1.8 lương thực.';
                } else if (stance === 'cham_chi') {
                  state.luongThuc += 2.4;
                  state.cui += 1.0;
                  beatMsg = '[Tua Chương - Thiên hướng Rèn nghề]: Bạn phụ việc không ngơi tay, đổi công lấy được +2.4 phần lương thực và +1 bó củi.';
                } else if (stance === 'nghe_ngong') {
                  state.luongThuc += 1.2;
                  const trace = DATA.rumor_traces[Math.floor(Math.random() * DATA.rumor_traces.length)];
                  if (!state.cluesFound.includes(trace)) state.cluesFound.push(trace);
                  beatMsg = '[Tua Chương - Điểm Ngắt Tin Đồn]: Bạn vừa kiếm ăn vừa lắng nghe người qua đường.\\n🌫️ ' + trace;
                } else {
                  state.sucKhoe = Math.min(100, state.sucKhoe + 10);
                  state.lanh = Math.max(10, state.lanh - 20);
                  state.luongThuc += 1.5;
                  beatMsg = '[Tua Chương - Điểm Ngắt Gia Đình]: Bạn bám sát người thân, được ủ ấm và chia sẻ thức ăn qua những ngày gió bấc.';
                }

                document.getElementById('narrativeBox').textContent = beatMsg;
                saveToLocal();
                render();
              }

              // Bốc nhân vật ngẫu nhiên theo trọng số giai cấp & Luân chuyển giai cấp (Mục 47.3 & 47.11)
              function drawRandomCharacter() {
                const weights = CONFIG.reincarnation.he_so_hiem;
                const pool = DATA.random_archetypes.map(arch => {
                  let w = weights[arch.giai_cap] || 0.5;
                  if (state.lastCompletedClass && arch.giai_cap !== state.lastCompletedClass) {
                    w *= CONFIG.reincarnation.he_so_luan_chuyen;
                  }
                  return { arch, w };
                });

                const totalW = pool.reduce((s, item) => s + item.w, 0);
                let r = Math.random() * totalW;
                let chosen = pool[0].arch;
                for (const item of pool) {
                  r -= item.w;
                  if (r <= 0) { chosen = item.arch; break; }
                }

                const randomYear = Math.floor(Math.random() * 190) + 5;
                const randomAge = Math.floor(Math.random() * (chosen.tuoi_max - chosen.tuoi_min + 1)) + chosen.tuoi_min;

                const customPersona = {
                  id: 'RAND_' + Date.now(),
                  title: '🎲 Kiếp Bốc Ngẫu Nhiên',
                  ten: chosen.kieu_doi,
                  tuoi: randomAge,
                  nam_sinh: randomYear,
                  giai_doan: chosen.giai_doan,
                  giai_cap: chosen.giai_cap,
                  than_phan: chosen.than_phan + ' (Năm ' + (randomYear + randomAge) + ')',
                  boi_canh_mo_ta: 'Bạn được bốc ngẫu nhiên theo trọng số giai cấp (Mục 47.3) vào năm ' + (randomYear + randomAge) + ' của lịch sử gốc Hoài Dương. Thế giới đã hồi quy nguyên vẹn (Mục 47.4).',
                  noi_chon: chosen.noi_chon,
                  do_vat: chosen.do_vat,
                  nguoi_xung_quanh: chosen.nguoi_xung_quanh,
                  nghia_vu: chosen.nghia_vu,
                  kien_thuc: chosen.kien_thuc,
                  cui: 1.5, luong_thuc: 1.5, lanh_ban_dau: 40, doi_ban_dau: 45,
                  luoi: 25, kien_nhan: 75, y_chi: 75, trach_nhiem: 70, can_dam: 60, hao_mon_suc_manh: 0, mu: false,
                  thien_phu_noi_bat: { ten: "Trực giác sinh tồn", key: "truc_giac", cau_bo_lo: "Bạn bỗng nhạy cảm khác thường với những biến động quanh làng." },
                  story: {
                    mong: chosen.mong,
                    so: chosen.so,
                    no_hua: chosen.no_hua,
                    bi_mat: chosen.bi_mat,
                    canh_cua: chosen.canh_cua
                  }
                };

                loadPersonaObject(customPersona, -1);
              }

              function showChronicle() {
                const modal = document.getElementById('chronicleModal');
                const p = state.persona;
                const f = predictFate();
                const caiMenhStatus = (state.initialDangerDays !== null && (f.dangerDay === null || f.dangerDay > state.initialDangerDays))
                  ? 'ĐÃ NGHỊCH THIÊN CẢI MỆNH (Đẩy lùi cái chết dự báo gốc)'
                  : 'Đang giữ nhịp sinh tồn';

                state.lastCompletedClass = p.giai_cap;

                modal.style.display = 'block';
                modal.innerHTML =
                  '<h2>📜 BIÊN NIÊN SỬ CUỐI ĐỜI & CÁO PHÓ (MỤC 37)</h2>' +
                  '<p><strong>Nhân vật:</strong> ' + p.ten + ' · <strong>Giai cấp:</strong> ' + p.than_phan + '</p>' +
                  '<p><strong>1. Cáo phó công khai (Lời người đời truyền miệng qua sương mù):</strong><br/>' +
                  '<em>"Người ấy đã đi qua những mùa Giá khắc nghiệt của Hoài Dương. Người trong vùng chỉ biết đó là một kẻ cần mẫn giữ lửa bên hiên nhà, chưa từng để bếp tắt giữa đêm đông."</em></p>' +
                  '<p><strong>2. Hồi ký thật (Sự thật lịch sử & Bảng chênh lệch số phận):</strong><br/>' +
                  '• Mức bẻ cong số phận: <strong>' + caiMenhStatus + '</strong><br/>' +
                  '• Bí mật mang theo: ' + p.story.bi_mat + '<br/>' +
                  '• Cánh cửa chạm tới Mối Nợ Gốc: ' + p.story.canh_cua + '<br/>' +
                  '• Dấu vết thu thập được: ' + (state.cluesFound.length > 0 ? state.cluesFound.length + ' mảnh tin đồn' : 'Sống cuộc đời bình lặng ngoài vòng xoáy') + '</p>' +
                  '<p style="color:#9ef0b6; font-size:13px;">(Theo Mục 47.4 & 47.11: Đời kế tiếp thế giới sẽ hồi quy về lịch sử gốc nguyên vẹn, đồng thời nhân x2.0 trọng số bốc ra giai cấp khác với đời vừa sống!)</p>';
              }

              let activePersonaIdx = 2;

              function loadPersonaObject(p, idx) {
                activePersonaIdx = idx;
                state.persona = JSON.parse(JSON.stringify(p));
                state.hour = 8;
                state.dayInSeason = 12;
                state.seasonIdx = 3;
                state.year = (p.nam_sinh || 30) + p.tuoi;
                state.theLuc = 82;
                state.sucKhoe = 85;
                state.doi = p.doi_ban_dau ?? 45;
                state.lanh = p.lanh_ban_dau ?? 40;
                state.chan = 10;
                state.so = 10;
                state.cui = p.cui ?? 1.5;
                state.luongThuc = p.luong_thuc ?? 1.5;
                state.amAnhDoi = 0;
                state.talentRevealed = false;
                state.actionsTaken = 0;
                state.cluesFound = [];
                document.getElementById('chronicleModal').style.display = 'none';

                calcTiers(state.persona);
                const initForecast = predictFate();
                state.initialDangerDays = initForecast.dangerDay;

                document.getElementById('narrativeBox').textContent =
                  '[NHẬP XÁC: ' + p.ten.toUpperCase() + ']\\n' + p.boi_canh_mo_ta;
                render();
              }

              function saveToLocal() {
                try {
                  localStorage.setItem('FATE_UNFIXED_SAVE', JSON.stringify({
                    year: state.year, cui: state.cui, luongThuc: state.luongThuc, authenticMode: state.authenticMode
                  }));
                } catch (e) {}
              }

              function render() {
                const p = state.persona;
                document.getElementById('headerTitle').textContent = 'THIÊN MỆNH KHẢ BIẾN · ' + p.ten + ' (' + p.tuoi + ' tuổi)';

                const bar = document.getElementById('personaBar');
                bar.innerHTML = '';
                DATA.personas.forEach((item, idx) => {
                  const b = document.createElement('button');
                  b.className = 'persona-btn' + (idx === activePersonaIdx ? ' active' : '');
                  b.textContent = item.title;
                  b.onclick = () => loadPersonaObject(item, idx);
                  bar.appendChild(b);
                });

                const fTheLuc = state.theLuc > 65 ? 'Dẻo dai' : (state.theLuc > 30 ? 'Thấm mệt' : 'Rã rời');
                const fDoi = state.doi < 35 ? 'Bụng êm' : (state.doi < 70 ? 'Hơi cồn cào' : 'Đói thắt ruột');
                const fLanh = state.lanh < 35 ? 'Đủ ấm' : (state.lanh < 70 ? 'Se lạnh' : 'Rét run cầm cập');
                const timeOfDay = (state.hour >= 6 && state.hour < 18) ? 'Ban ngày' : 'Ban đêm';

                document.getElementById('worldClockCard').innerHTML =
                  '<strong>⏳ Thời gian & Sinh tồn (Mục 7.1, 50.4):</strong><br/>' +
                  'Năm ' + state.year + ' Hoài Dương · Mùa <strong>' + CONFIG.time.seasons[state.seasonIdx] + '</strong> (Ngày ' + state.dayInSeason + '/15) · ' + Math.floor(state.hour) + 'h00 (' + timeOfDay + ')<br/>' +
                  'Cảm nhận: ' + fTheLuc + ' | ' + fDoi + ' | ' + fLanh + '<br/>' +
                  'Dự trữ: <strong>' + state.cui.toFixed(1) + ' bó củi</strong> · <strong>' + state.luongThuc.toFixed(1) + ' phần lương thực</strong>' +
                  (state.amAnhDoi > 0 ? '<br/><span style="color:#ff9e7d;">[Ám ảnh đói/lạnh]: Thôi thúc tích trữ lương thực & củi</span>' : '');

                document.getElementById('personalStoryCard').innerHTML =
                  '<strong>📖 Câu chuyện riêng & Dây Chằng (Mục 51.5):</strong><br/>' +
                  '• <strong>Mong:</strong> ' + p.story.mong + '<br/>' +
                  '• <strong>Sợ:</strong> ' + p.story.so + '<br/>' +
                  '• <strong>Nợ/Lời hứa:</strong> ' + p.story.no_hua + '<br/>' +
                  '• <strong>Bí mật nhỏ:</strong> ' + p.story.bi_mat;

                // Đường dự báo số phận (Mục 10)
                const f = predictFate();
                const banner = document.getElementById('fateBanner');
                if (f.dangerDay === null) {
                  banner.className = 'fate-banner safe';
                  banner.textContent = (state.initialDangerDays !== null)
                    ? '🌟 ĐƯỜNG DỰ BÁO SỐ PHẬN (MỤC 10): ĐÃ NGHỊCH THIÊN CẢI MỆNH! Từ chỗ dự báo chết sau ' + state.initialDangerDays + ' ngày, nay bạn đã tích đủ củi và lương thực để sống qua mùa Giá!'
                    : '🟢 ĐƯỜNG DỰ BÁO SỐ PHẬN (MỤC 10): An toàn qua 14 ngày tới với lượng củi và lương thực hiện có.';
                } else {
                  banner.className = 'fate-banner danger';
                  banner.textContent = '⚠️ ĐƯỜNG DỰ BÁO SỐ PHẬN (MỤC 10): Dự báo chạm ngưỡng nguy hiểm sau ' + f.dangerDay + ' ngày nữa (' + f.cause + '). Hãy bổ củi, săn thỏ hoặc kiếm thức ăn để đẩy lùi ngày nguy hiểm!';
                }

                // Vẽ Menu theo nhóm
                const menu = document.getElementById('menuBox');
                menu.innerHTML = '';
                const actions = getMenu(p);
                const groups = {};
                actions.forEach(a => {
                  const g = a.nhom || 'Hành động';
                  if (!groups[g]) groups[g] = [];
                  groups[g].push(a);
                });

                for (const [gName, list] of Object.entries(groups)) {
                  const gTitle = document.createElement('div');
                  gTitle.className = 'action-group-title';
                  gTitle.textContent = gName;
                  menu.appendChild(gTitle);

                  list.forEach(tpl => {
                    const row = document.createElement('div');
                    row.className = 'action-row';
                    const btn = document.createElement('button');
                    btn.className = 'action-btn';
                    btn.textContent = '▶ ' + tpl.ten_vi + ' (' + tpl.thoi_luong_mo + ')';
                    btn.onclick = () => runAction(tpl, false);
                    row.appendChild(btn);

                    if (!tpl.tag.includes('ban_nang')) {
                      const pBtn = document.createElement('button');
                      pBtn.className = 'push-btn';
                      pBtn.textContent = 'Gắng gượng';
                      pBtn.onclick = () => runAction(tpl, true);
                      row.appendChild(pBtn);
                    }
                    menu.appendChild(row);
                  });
                }
              }

              document.getElementById('btnRandomDraw').onclick = drawRandomCharacter;
              document.getElementById('btnSkipBeat').onclick = skipToNextBeat;
              document.getElementById('btnShowChronicle').onclick = showChronicle;
              document.getElementById('btnAuthentic').onclick = function() {
                state.authenticMode = !state.authenticMode;
                this.className = 'toggle-authentic' + (state.authenticMode ? ' on' : '');
                this.textContent = state.authenticMode ? 'Chế độ Chân thực: BẬT (Tự lưu để thoát)' : 'Chế độ Chân thực: TẮT';
              };

              // Mở mặc định Persona số 3 (Test case Trai mồ côi cải mệnh mùa đông Mục 10)
              loadPersonaObject(DATA.personas[2], 2);
            </script>
          </body>
          </html>`;

          const finalHtml = htmlTemplate
            .replace('__CONFIG_JSON__', JSON.stringify(gameConfig))
            .replace('__DATA_JSON__', JSON.stringify(worldData));
          writeFile('docs/index.html', finalHtml);

          // 5. Bộ kiểm thử tự động GĐ1 + GĐ2 + GĐ3 (Kiểm tra cả Test Case Trai Mồ Côi Mục 10)
          const testScript = `
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('assets/resources/data/config/game_config.json', 'utf8'));
          const data = JSON.parse(fs.readFileSync('assets/resources/data/world/tu_dien.json', 'utf8'));

          function assert(cond, msg) {
            if (!cond) { console.error('[THẤT BẠI] ' + msg); process.exit(1); }
            console.log('[ĐẠT] ' + msg);
          }

          function predictDays(doi, lanh, sk, cui, food) {
            for (let d = 1; d <= 14; d++) {
              if (food >= 0.8) { food -= 0.8; doi = Math.max(10, doi - 20); }
              else { doi += 22; }
              if (cui >= 0.8) { cui -= 0.8; lanh = Math.max(10, lanh - 15); }
              else { lanh += 25; }
              if (doi >= 95) sk -= 28; else if (doi >= 75) sk -= 12;
              if (lanh >= 95) sk -= 30; else if (lanh >= 75) sk -= 14;
              if (sk <= 0) return d;
            }
            return null;
          }

          console.log('--- CHẠY KIỂM THỬ THỰC TẠI GĐ1, GĐ2 & GĐ3 ---');
          const p3 = data.personas[2];
          // Kết cục 1: Không làm gì -> đường dự báo chạm 0 trong mùa Giá
          const initialDanger = predictDays(p3.doi_ban_dau, p3.lanh_ban_dau, 85, p3.cui, p3.luong_thuc);
          assert(initialDanger !== null && initialDanger <= 6, 'Test Case Mục 10 (Kết cục gốc): Không hành động sẽ chạm ngưỡng chết đói/lạnh sau ' + initialDanger + ' ngày');

          // Kết cục 2: Bổ củi và săn thỏ -> đẩy lùi đường dự báo qua mùa đông
          const afterActionDanger = predictDays(25, 20, 85, p3.cui + 12, p3.luong_thuc + 12);
          assert(afterActionDanger === null, 'Test Case Mục 10 (Cải mệnh): Bổ củi + săn thỏ đẩy lùi ngày nguy hiểm, sống sót qua mùa Giá');
          assert(data.random_archetypes.length >= 6, 'Đã nạp ngân hàng Kiểu đời và Bốc ngẫu nhiên theo trọng số giai cấp');
          `;
          writeFile('tests/run_reality_tests.js', testScript);
          EOF
          node generate_project.js
          rm generate_project.js

      - name: Chạy Kiểm thử GĐ1 + GĐ2 (Test case Cải mệnh mùa đông Mục 10)
        run: node tests/run_reality_tests.js

      - name: Cập nhật toàn bộ file lên GitHub Repository & GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Upgrade to Stage 2 & 3: Fate Predictor, 4 Seasons, Frenetic Timer, Stance Skip & Story Archetypes"
          git push
