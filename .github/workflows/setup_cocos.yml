name: Auto Setup Cocos Creator & Web Preview (No-Scroll Split UI)

on:
  push:
    paths:
      - '.github/workflows/setup_cocos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cập nhật Giao diện Split-Screen (Không cuộn trang) & Đồng bộ Cocos Creator
        run: |
          cat << 'EOF' > generate_project.js
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          function writeFile(filePath, content, createCocosMeta = false) {
            const dir = path.dirname(filePath);
            fs.mkdirSync(dir, { recursive: true });
            const data = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
            fs.writeFileSync(filePath, data, 'utf8');
            if (createCocosMeta && !fs.existsSync(filePath + '.meta')) {
              const uuid = crypto.randomUUID();
              fs.writeFileSync(filePath + '.meta', JSON.stringify({ ver: "1.0.0", uuid, importer: "auto" }, null, 2), 'utf8');
            }
          }

          // 1. Cấu hình công thức GĐ1 - GĐ3
          const gameConfig = {
            time: {
              tick_minutes: 1,
              micro_step_minutes: 6,
              daylight_start_hour: 6,
              daylight_end_hour: 18,
              days_per_season: 15,
              seasons: ["Nảy (Xuân)", "Nắng (Hạ)", "Gặt (Thu)", "Giá (Đông)"]
            },
            survival: {
              hourly_hunger_gain: 2.2,
              hourly_cold_gain_winter_night: 8.0,
              hourly_cold_gain_winter_day: 3.0,
